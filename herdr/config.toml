# Herdr configuration modeled after tmux.conf in this repository.
# ~/.config/herdr/config.toml links to this file.

onboarding = false

[theme]
# Use the outer terminal's palette, matching the white/black tmux theme.
name = "terminal"

[terminal]
# Match tmux's behavior: new panes and tabs inherit the current directory.
new_cwd = "follow"

[keys]
# Use the GNU Screen-compatible prefix configured in tmux.
prefix = "ctrl+a"

# Session/workspace navigation.
# Keep Herdr's workspace-only picker available without occupying tmux's w key.
workspace_picker = "prefix+alt+w"
# Keep the custom Ctrl-f find-session binding on Herdr's broader navigator.
new_workspace = "prefix+ctrl+c"
detach = "prefix+d"
# tmux session navigation maps to Herdr workspace navigation.
rename_workspace = ["prefix+shift+w", "prefix+$"]
previous_workspace = "prefix+("
next_workspace = "prefix+)"
# Retain tmux's find-window shortcut as another route to Herdr's navigator.
goto = ["prefix+ctrl+f", "prefix+f"]

# Window/tab navigation.
new_tab = "prefix+c"
rename_tab = "prefix+comma"
# Keep Herdr's ordered previous-tab action on tmux's alternate binding.
previous_tab = "prefix+alt+p"
next_tab = "prefix+ctrl+l"
switch_tab = "prefix+1..9"
close_tab = "prefix+ampersand"

# Pane layout and navigation.
split_vertical = ["prefix+/", "prefix+percent"]
split_horizontal = ["prefix+minus", "prefix+double_quote"]
focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_down = ["prefix+j", "prefix+down"]
focus_pane_up = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]
swap_pane_up = ["prefix+shift+comma", "prefix+{"]
swap_pane_down = ["prefix+shift+period", "prefix+}"]
cycle_pane_next = "prefix+o"
last_pane = "prefix+semicolon"
close_pane = "prefix+x"
zoom = "prefix+z"
toggle_sidebar = "prefix+b"

# Copy, resize, and configuration controls.
copy_mode = ["prefix+enter", "prefix+[", "alt+u"]
resize_mode = "prefix+shift+r"
reload_config = "prefix+r"
edit_scrollback = "prefix+alt+e"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
description = "Toggle clean pane copy view"
command = "zky.tmux-compat.toggle-clean-copy-view"

# Exact tmux semantics supplied by the local compatibility plugin:
#   w   -> choose-tree across every pane
#   Tab -> last-window (most-recently-used tab)
[[keys.command]]
key = "prefix+w"
type = "plugin_action"
description = "Choose any pane"
command = "zky.tmux-compat.choose-pane"

[[keys.command]]
key = "prefix+tab"
type = "plugin_action"
description = "Switch to most recent tab"
command = "zky.tmux-compat.last-tab"

[[keys.command]]
key = "prefix+e"
type = "popup"
description = "Edit Herdr configuration"
command = "sh -lc '${EDITOR:-vim} \"${HERDR_CONFIG_PATH:-$HOME/.config/herdr/config.toml}\"; herdr server reload-config'"
width = "90%"
height = "90%"

# tmux also binds _ to a right-hand split.
[[keys.command]]
key = "prefix+shift+minus"
type = "shell"
description = "Split pane right"
command = "herdr pane split --current --direction right --focus"

# Move the focused pane into its own tab, matching tmux break-pane.
[[keys.command]]
key = "prefix+!"
type = "shell"
description = "Move pane to new tab"
command = "\"$HERDR_BIN_PATH\" pane move \"$HERDR_ACTIVE_PANE_ID\" --new-tab --focus"

# Retain tmux's Ctrl-h previous-window shortcut as another MRU switch.
[[keys.command]]
key = "prefix+ctrl+h"
type = "plugin_action"
description = "Switch to most recent tab"
command = "zky.tmux-compat.last-tab"

# tmux uses uppercase H/J/K/L (and Ctrl-j/Ctrl-k) for pane resizing.
[[keys.command]]
key = "prefix+shift+h"
type = "shell"
description = "Resize pane left"
command = "herdr pane resize --current --direction left"

[[keys.command]]
key = "prefix+shift+j"
type = "shell"
description = "Resize pane down"
command = "herdr pane resize --current --direction down"

[[keys.command]]
key = "prefix+shift+k"
type = "shell"
description = "Resize pane up"
command = "herdr pane resize --current --direction up"

[[keys.command]]
key = "prefix+shift+l"
type = "shell"
description = "Resize pane right"
command = "herdr pane resize --current --direction right"

[[keys.command]]
key = "prefix+ctrl+j"
type = "shell"
description = "Resize pane down"
command = "herdr pane resize --current --direction down"

[[keys.command]]
key = "prefix+ctrl+k"
type = "shell"
description = "Resize pane up"
command = "herdr pane resize --current --direction up"

# tmux-style one-cell resize shortcuts. Herdr expresses resize amounts as a
# fraction of the available layout, so 0.01 is the closest portable match.
[[keys.command]]
key = "prefix+ctrl+left"
type = "shell"
description = "Resize pane left (small)"
command = "\"$HERDR_BIN_PATH\" pane resize --current --direction left --amount 0.01"

[[keys.command]]
key = "prefix+ctrl+down"
type = "shell"
description = "Resize pane down (small)"
command = "\"$HERDR_BIN_PATH\" pane resize --current --direction down --amount 0.01"

[[keys.command]]
key = "prefix+ctrl+up"
type = "shell"
description = "Resize pane up (small)"
command = "\"$HERDR_BIN_PATH\" pane resize --current --direction up --amount 0.01"

[[keys.command]]
key = "prefix+ctrl+right"
type = "shell"
description = "Resize pane right (small)"
command = "\"$HERDR_BIN_PATH\" pane resize --current --direction right --amount 0.01"

# tmux-style five-cell resize shortcuts. A 0.05 layout fraction is Herdr's
# native resize step and is the closest portable match.
[[keys.command]]
key = "prefix+alt+left"
type = "shell"
description = "Resize pane left (large)"
command = "\"$HERDR_BIN_PATH\" pane resize --current --direction left --amount 0.05"

[[keys.command]]
key = "prefix+alt+down"
type = "shell"
description = "Resize pane down (large)"
command = "\"$HERDR_BIN_PATH\" pane resize --current --direction down --amount 0.05"

[[keys.command]]
key = "prefix+alt+up"
type = "shell"
description = "Resize pane up (large)"
command = "\"$HERDR_BIN_PATH\" pane resize --current --direction up --amount 0.05"

[[keys.command]]
key = "prefix+alt+right"
type = "shell"
description = "Resize pane right (large)"
command = "\"$HERDR_BIN_PATH\" pane resize --current --direction right --amount 0.05"

# tmux-style information and clock popups.
[[keys.command]]
key = "prefix+i"
type = "popup"
description = "Display pane information"
command = "sh -lc '\"$HERDR_BIN_PATH\" pane get \"$HERDR_ACTIVE_PANE_ID\"; printf \"\\nPress Enter to close...\"; read _'"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+t"
type = "popup"
description = "Show clock"
command = "sh -lc 'date \"+%Y-%m-%d %H:%M:%S\"; printf \"\\nPress Enter to close...\"; read _'"
width = 44
height = 7

[ui]
# Keep the persistent agent overview, but use compact one-line rows.
pane_gaps = false
pane_borders = true
pane_scrollbars = true

# Keep Herdr's mouse UI enabled by default. Ctrl-a m toggles this at runtime
# so the outer terminal can handle ordinary drag selection when needed.
mouse_capture = true
copy_on_select = true

# Ctrl-a b must remove the sidebar completely for clean outer-terminal
# selection; Ghostty uses it as part of Ctrl-a m.
sidebar_collapsed_mode = "hidden"

# A single-tab workspace should not leave a tab row in clean copy view.
hide_tab_bar_when_single_tab = true

agent_panel_sort = "spaces"
[experimental]
# tmux-resurrect preserves pane output; enable Herdr's corresponding history.
pane_history = true

[advanced]
# Herdr uses a byte limit rather than tmux's line count. Ten MiB comfortably
# covers the 50,000-line history configured in tmux for typical terminal text.
scrollback_limit_bytes = 10485760
