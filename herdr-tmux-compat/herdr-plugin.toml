id = "zky.tmux-compat"
name = "Tmux Compatibility"
version = "0.7.0"
min_herdr_version = "0.8.0"
description = "Tmux-style pane chooser, recent-tab switching, and clean copy view"
platforms = ["macos"]

[[actions]]
id = "choose-pane"
title = "Choose pane"
contexts = ["global"]
command = ["sh", "scripts/open-pane-picker"]

[[actions]]
id = "last-tab"
title = "Switch to most recent tab"
contexts = ["global"]
command = ["sh", "scripts/last-tab"]

[[actions]]
id = "toggle-clean-copy-view"
title = "Toggle clean pane copy view"
contexts = ["global"]
command = ["sh", "scripts/toggle-clean-copy-view"]

[[events]]
on = "tab.focused"
command = ["sh", "scripts/track-tab-event"]

[[events]]
on = "tab.closed"
command = ["sh", "scripts/track-tab-event"]

[[panes]]
id = "pane-picker"
title = "Choose pane"
placement = "overlay"
command = ["python3", "scripts/pane-tree.py"]
